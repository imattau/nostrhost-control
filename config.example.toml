# nostrhost-control — control-plane relay configuration.
#
# The relay binds loopback only: this is the local control plane, not a
# public relay. Set operator_pubkey to your admin identity (hex pubkey).

listen_host = "127.0.0.1"
listen_port = 4848

name        = "nostrhost"
description = "NostrHost local control plane"
# icon = "https://example.com/icon.png"

# Required: the primary administrator (hex pubkey).
operator_pubkey = ""

# The server's own machine key (hex pubkey): an allowlisted WRITER for
# execution events (2203/2204), NOT an admin. Optional.
# server_pubkey = ""

# Additional administrators (hex pubkeys).
# admin_pubkeys = ["...", "..."]

# In allowlist mode only explicitly allowed pubkeys may publish (admins are
# auto-allowed; server/notice/publisher/agent keys are allowlisted as writers).
# ON by default in the example: loopback is not an authorization boundary, and
# an open relay lets any local process forge capability grants / approvals.
allowlist_mode = true

# Kinds that require NIP-42 AUTH to write (and read).
#   absent  -> the control-plane default set is used (control kinds, NIP-78
#              app data, NIP-51 lists) — RECOMMENDED
#   []      -> NIP-42 not required (writes are gated only by the allowlist +
#              the per-author rules below)
#   [k,...] -> exactly these kinds
# require_auth_kinds = []

# Optional kind allowlist: when non-empty, only these kinds are stored
# (anything else is rejected unless later allowed via NIP-86 allowkind).
# An empty list means "no kind restriction" — the author rules below (see
# server.go rejectUnauthorizedAuthorPolicy) still gate the server-
# authoritative kinds regardless of this setting.
allowed_kinds = []
denied_kinds  = []

max_content_length = 100000

events_db_path = "./data/events.db"
policy_db_path = "./data/policy.db"

# Kinds that are stored but aged out after keep_for (operation requests, for
# example, are kept for audit but pruned after a retention window).
[[prunable]]
kind     = 2200
keep_for = "720h"